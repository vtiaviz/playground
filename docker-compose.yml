services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: playground
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # cria também o banco usado pelos testes automatizados (só roda na 1ª criação do volume)
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
